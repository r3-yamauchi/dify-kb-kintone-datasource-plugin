identity:
  name: "kintone-online-document"
  author: "r3-yamauchi"
  label:
    en_US: "kintone app"
    zh_Hans: "kintone 在线文档"
    pt_BR: "Documentos kintone"
    ja_JP: "kintone アプリ"
description:
  en_US: "Sync kintone app records into Dify as online documents. Fetch kintone records and expose them as workspace/page content for the knowledge base."
  zh_Hans: "将 kintone 应用数据同步为 Dify 在线文档，并把记录作为知识库的页面内容提供。"
  pt_BR: "Sincronize registros do kintone como documentos online do Dify e disponibilize-os como conteúdo do workspace/página."
  ja_JP: "kintone アプリのレコードを Dify のオンラインドキュメントとして同期し、ナレッジベースのワークスペース/ページとして公開します。"

parameters:
  - name: app_id
    type: string
    required: true
    label:
      en_US: kintone App ID
      zh_Hans: kintone 应用 ID
      pt_BR: ID do aplicativo kintone
      ja_JP: kintone アプリID
    description:
      en_US: "Numeric app ID copied from the kintone app settings. App identifier used as the workspace ID."
      zh_Hans: "可在 kintone 应用设置中找到的数值 ID。该值也会作为工作区 ID 使用。"
      pt_BR: "ID numérico disponível na configuração do aplicativo. Esse identificador também será usado como ID do workspace."
      ja_JP: "kintone アプリ設定から確認できる数値 ID。ワークスペース ID としても利用します。"
  - name: query
    type: string
    required: false
    label:
      en_US: kintone Query
      zh_Hans: kintone 查询
      pt_BR: Consulta kintone
      ja_JP: kintone クエリ
    description:
      en_US: "Optional kintone query string (e.g. 'status = \"Open\" order by 更新日時 desc'). If empty the datasource fetches records in creation order."
      zh_Hans: "可选的 kintone 查询语句（例如：'status = \"Open\" order by 更新日時 desc'）。为空时按创建顺序获取记录。"
      pt_BR: "Consulta opcional para filtrar registros (ex.: 'status = \"Open\" order by 更新日時 desc'). Quando vazio, os registros são buscados em ordem de criação."
      ja_JP: "任意の kintone クエリ（例: 'status = \"Open\" order by 更新日時 desc'）を指定できます。空の場合は作成順でレコードを取得します。"
  - name: max_records
    type: number
    required: false
    min: 1
    max: 500
    default: 100
    label:
      en_US: Maximum Records
      zh_Hans: 记录上限
      pt_BR: Máximo de registros
      ja_JP: 最大取得件数
    description:
      en_US: "Cap how many records are exposed per sync run (kintone allows up to 500 per request). Controls pagination batch size."
      zh_Hans: "限制每次同步的记录数量（kintone 单次请求最多 500 条），并控制分页批量大小。"
      pt_BR: "Limite quantos registros são retornados por sincronização (máx. 500 por requisição no kintone). Controla também o lote de paginação."
      ja_JP: "1 回の同期で取り込むレコード数を制限します（kintone API は 1 リクエスト 500 件まで）。ページネーションのバッチサイズも制御します。"
  - name: title_field
    type: string
    required: false
    label:
      en_US: Field code for page title
      zh_Hans: 页面标题字段代码
      pt_BR: Código do campo para título
      ja_JP: ページタイトル用フィールドコード
    description:
      en_US: "Optional field code whose value becomes the page title. Fallback to record id when empty."
      zh_Hans: "可选字段，用于生成页面标题。未设置时将使用记录 ID。"
      pt_BR: "Campo opcional usado como título. Quando vazio, usa o ID do registro."
      ja_JP: "ページタイトルに利用する任意のフィールドコード。未指定の場合はレコード ID を使用します。"
  - name: debug_logging
    type: boolean
    required: false
    default: false
    label:
      en_US: Enable debug logging
      zh_Hans: 启用调试日志
      pt_BR: Ativar logs de depuração
      ja_JP: デバッグログを有効化
    description:
      en_US: "When true, emits verbose progress logs during sync runs. Toggle for verbose logging; defaults to false."
      zh_Hans: "为 true 时输出更详细的同步日志。用于控制是否启用详细日志，默认关闭。"
      pt_BR: "Quando verdadeiro, registra mensagens detalhadas da sincronização. Alterna o modo verboso; padrão é falso."
      ja_JP: "true の場合、同期処理の詳細ログを出力します。冗長ログの切り替えで、既定値は false です。"

output_schema:
  type: object
  properties:
    workspace_id:
      type: string
      description: kintone app id used as workspace id
    page_id:
      type: string
      description: kintone record id
    content:
      type: string
      description: Flattened field content from the record

extra:
  python:
    source: datasources/dify_kb_kintone_datasource_plugin.py
