identity:
  name: "dify-kb-kintone-datasource-plugin"
  author: "r3-yamauchi"
  description:
    en_US: "Configure the kintone domain and API token used by the datasource"
    zh_Hans: "配置用于数据源的 kintone 域名和 API 令牌"
    pt_BR: "Configure o domínio e o token API do kintone usados pela fonte de dados"
    ja_JP: "このデータソースで利用する kintone ドメインと API トークンを設定します"
  icon: "icon.svg"
  label:
    en_US: "kintone app"
    zh_Hans: "kintone 数据源提供者"
    pt_BR: "Provedor do kintone"
    ja_JP: "kintone アプリ"
description:
  en_US: "Stores credentials required to talk to the kintone REST API."
  zh_Hans: "存储访问 kintone REST API 所需的凭证。"
  pt_BR: "Armazena credenciais necessárias para conversar com a API REST do kintone."
  ja_JP: "kintone REST API との通信に必要な認証情報を保存します。"

provider_type: online_document

credentials_schema:
  - name: base_url
    type: text-input
    required: true
    label:
      en_US: kintone Base URL
      zh_Hans: kintone 基础 URL
      pt_BR: URL base do kintone
      ja_JP: kintone ベースURL
    human_description:
      en_US: "Example: https://sample.cybozu.com"
      zh_Hans: "例如：https://sample.cybozu.com"
      pt_BR: "Exemplo: https://sample.cybozu.com"
      ja_JP: "例: https://sample.cybozu.com"
    placeholder:
      en_US: "https://example.cybozu.com"
      zh_Hans: "https://example.cybozu.com"
      pt_BR: "https://example.cybozu.com"
      ja_JP: "https://example.cybozu.com"
  - name: api_token
    type: secret-input
    required: true
    label:
      en_US: kintone API Token
      zh_Hans: kintone API 令牌
      pt_BR: Token de API do kintone
      ja_JP: kintone APIトークン
    human_description:
      en_US: "Issue a record-read token for the target app (permission: view records)"
      zh_Hans: "请为目标应用颁发仅具读取权限的令牌"
      pt_BR: "Emita um token com permissão de leitura para o aplicativo"
      ja_JP: "対象アプリ向けのレコード閲覧トークンを設定してください"
  - name: app_id
    type: text-input
    required: true
    label:
      en_US: kintone App ID
      zh_Hans: kintone 应用 ID
      pt_BR: ID do aplicativo kintone
      ja_JP: kintone アプリID
    human_description:
      en_US: "Enter the numeric App ID used for synchronization (same as the datasource app_id)."
      zh_Hans: "输入用于同步的数值型 App ID（与数据源 app_id 相同）。"
      pt_BR: "Informe o App ID numérico usado na sincronização (igual ao app_id da fonte de dados)."
      ja_JP: "同期に利用する数値の App ID を入力します（データソースの app_id と同じ値です）。"

datasources:
  - datasources/dify-kb-kintone-datasource-plugin.yaml

extra:
  python:
    source: provider/dify_kb_kintone_datasource_plugin.py
